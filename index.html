<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Engine</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark">PE</span><span>Photo Engine</span></div><div class="top-actions"><button class="button ghost" id="reset" disabled>リセット</button><label class="button primary" for="fileInput">画像を開く</label><input id="fileInput" type="file" accept="image/*" hidden><button class="button" id="save" disabled>書き出す</button></div></header>
<main class="workspace"><aside class="panel"><section><p class="eyebrow">ADJUST</p><h2>光と色</h2><div id="sliders"></div></section><section><p class="eyebrow">TRANSFORM</p><h2>向き</h2><div class="button-grid"><button class="tool-button" data-action="rotateLeft" disabled>↶<span>左回転</span></button><button class="tool-button" data-action="rotateRight" disabled>↷<span>右回転</span></button><button class="tool-button" data-action="flipX" disabled>↔<span>左右反転</span></button><button class="tool-button" data-action="flipY" disabled>↕<span>上下反転</span></button></div></section></aside>
<section class="stage" id="dropZone"><div class="empty" id="emptyState"><div class="empty-icon">＋</div><h1>写真を置いて、整える。</h1><p>画像をドラッグ＆ドロップするか、画像を開いてください。</p><label class="button primary large" for="fileInput">画像を選ぶ</label><small>画像はブラウザ内だけで処理されます</small></div><div class="canvas-wrap" id="canvasWrap" hidden><canvas id="canvas"></canvas><div class="compare-label" id="compareLabel" hidden>ORIGINAL</div></div><div class="stage-tools" id="stageTools" hidden><button class="button ghost" id="compare">長押しで比較</button><span id="imageInfo"></span></div></section></main>
<dialog id="exportDialog"><form method="dialog" class="dialog-card"><div><p class="eyebrow">EXPORT</p><h2>画像を書き出す</h2></div><label>形式<select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></label><label id="qualityRow" hidden>品質 <span id="qualityValue">92%</span><input id="quality" type="range" min="10" max="100" value="92"></label><div class="dialog-actions"><button class="button ghost" value="cancel">キャンセル</button><button class="button primary" id="download" value="default">ダウンロード</button></div></form></dialog><script src="script.js"></script></body></html>
